name: Miu Android APK emulator validation
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: APK build run ID
        required: true
        default: '38949642285'
  push:
    branches: [codex/miu-boot-colors]
    paths: [.github/workflows/miu-android-smoke.yml]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: miu-android-x86_64
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || '38949642285' }}
      - name: Install and exercise on Android 16
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p results
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'system-images;android-36;google_apis;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n miu-api36 -k 'system-images;android-36;google_apis;x86_64' --device pixel_6
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd miu-api36 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > results/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install apk/MiuAI-Android-x86_64.apk > results/install.txt
          adb logcat -c
          adb shell am start -W -n ai.miu.controller/com.carriez.flutter_hbb.MainActivity > results/start.txt
          sleep 15
          adb shell pidof ai.miu.controller >> results/start.txt
          adb exec-out screencap -p > results/android16-portrait.png
          adb shell uiautomator dump /sdcard/miu-window.xml
          adb pull /sdcard/miu-window.xml results/portrait.xml
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 3
          adb exec-out screencap -p > results/android16-landscape.png
          adb shell am force-stop ai.miu.controller
          adb shell am start -W -n ai.miu.controller/com.carriez.flutter_hbb.MainActivity >> results/start.txt
          sleep 5
          adb shell pidof ai.miu.controller >> results/start.txt
          adb logcat -d > results/android16-logcat.txt
          if grep -E 'FATAL EXCEPTION|Fatal signal|E/flutter.*(Unhandled Exception|Error)' results/android16-logcat.txt; then exit 1; fi
          adb shell getprop ro.build.version.sdk > results/api.txt
          adb shell getconf PAGE_SIZE > results/page-size.txt
          sha256sum apk/MiuAI-Android-x86_64.apk > results/tested-apk-sha256.txt
          adb emu kill
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: miu-android16-emulator-results
          path: results/
